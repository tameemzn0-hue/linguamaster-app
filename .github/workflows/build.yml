name: Build LinguaMaster Online APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. استخراج كافة ملفات المشروع ونقلها للرئيسية
      - name: Extract Project & Prepare Root
        run: |
          cat << 'EOF' > prepare.py
          import zipfile, glob, os, shutil

          zips = glob.glob("*.zip")
          if zips:
              print(f"Unzipping {zips[0]}...")
              with zipfile.ZipFile(zips[0], "r") as z:
                  z.extractall("temp_ext")

              pkg_path = None
              for r, d, files in os.walk("temp_ext"):
                  if "package.json" in files:
                      pkg_path = os.path.join(r, "package.json")
                      break

              if pkg_path:
                  src_dir = os.path.dirname(pkg_path)
                  for root, dirs, files in os.walk(src_dir):
                      rel = os.path.relpath(root, src_dir)
                      target = "." if rel == "." else os.path.join(".", rel)
                      os.makedirs(target, exist_ok=True)
                      for f in files:
                          sf = os.path.join(root, f)
                          df = os.path.join(target, f)
                          shutil.copy2(sf, df)

              shutil.rmtree("temp_ext", ignore_errors=True)

          if not os.path.exists("index.html"):
              html_files = [h for h in glob.glob("**/index.html", recursive=True) if "node_modules" not in h and "dist" not in h]
              if html_files:
                  shutil.copy2(html_files[0], "index.html")
              else:
                  candidates = ["src/main.tsx", "src/main.jsx", "src/main.js", "src/index.tsx", "src/App.tsx", "index.js", "App.js"]
                  entry = "src/main.tsx"
                  for c in candidates:
                      if os.path.exists(c):
                          entry = c
                          break
                  
                  html_content = f"""<!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>LinguaMaster</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/{entry}"></script>
            </body>
          </html>"""
                  with open("index.html", "w") as f:
                      f.write(html_content)

          print("Project prepared successfully.")
          EOF
          python3 prepare.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. حل جذري لتثبيت الحزم وتجاوز تعارضات Expo/React-Native
      - name: Install dependencies
        run: |
          npm config set legacy-peer-deps true
          npm install --legacy-peer-deps --force
          npm install -D vite @vitejs/plugin-react @expo/cli --legacy-peer-deps --force

      # 3. بناء الويب
      - name: Build Web Application
        run: |
          if grep -q '"expo"' package.json 2>/dev/null; then
            npx expo export -p web || npx vite build || npm run build
          else
            npx vite build || npm run build
          fi

          if [ ! -d "dist" ]; then
            if [ -d "web-build" ]; then cp -r web-build dist; fi
            if [ -d "build" ]; then cp -r build dist; fi
            if [ -d "public" ] && [ ! -d "dist" ]; then cp -r public dist; fi
          fi

      # 4. إعداد وبناء تطبيق الأندرويد
      - name: Setup Capacitor for Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --force
          if [ ! -d "android" ]; then
            npx cap init "إتقان اللغات" "com.gamesta.linguamaster" --web-dir "dist"
            npx cap add android
          fi
          npx cap sync android

      - name: Auto Increment App Version
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/g' $GRADLE_FILE
            sed -i 's/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/g' $GRADLE_FILE
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Gradle Wrapper Version
        run: |
          cd android
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin

      - name: Generate Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LinguaMaster,OU=App,O=Gamesta,L=City,S=State,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaMaster-Online-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
