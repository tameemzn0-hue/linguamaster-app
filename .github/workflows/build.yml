name: Build LinguaMaster Online APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # فك ضغط مشروع Zip واستخراج الملفات للرئيسية بدقة عبر Python
      - name: Extract Project Files
        run: |
          python3 -c '
          import zipfile, glob, os, shutil
          zips = glob.glob("*.zip")
          if zips:
              print(f"Unzipping {zips[0]}...")
              with zipfile.ZipFile(zips[0], "r") as z:
                  z.extractall("temp_ext")
              pkg = None
              for r, d, files in os.walk("temp_ext"):
                  if "package.json" in files:
                      pkg = os.path.join(r, "package.json")
                      break
              if pkg:
                  src = os.path.dirname(pkg)
                  print(f"Found package.json in {src}, moving files to root...")
                  for item in os.listdir(src):
                      s = os.path.join(src, item)
                      d = os.path.join(".", item)
                      if os.path.isdir(s):
                          shutil.copytree(s, d, dirs_exist_ok=True)
                      else:
                          shutil.copy2(s, d)
              shutil.rmtree("temp_ext", ignore_errors=True)
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # التأكد من وجود أمر بناء المشروع وإصلاحه تلقائياً قبل التشغيل
      - name: Fix Package Scripts & Build Web App
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("package.json")) {
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              pkg.scripts = pkg.scripts || {};
              if (!pkg.scripts.build) {
                pkg.scripts.build = "vite build";
                fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
              }
            }
          '
          npm run build

      - name: Setup Capacitor for Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap init "إتقان اللغات" "com.gamesta.linguamaster" --web-dir "dist"
            npx cap add android
          fi
          npx cap sync android

      - name: Auto Increment App Version
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/g' $GRADLE_FILE
            sed -i 's/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/g' $GRADLE_FILE
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Gradle Wrapper Version
        run: |
          cd android
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin

      - name: Generate Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LinguaMaster,OU=App,O=Gamesta,L=City,S=State,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaMaster-Online-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
