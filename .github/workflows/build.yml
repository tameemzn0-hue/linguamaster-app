name: Build Mini Militia APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. تهيئة المجلد وإنشاء package.json تلقائياً إن لم يوجد
      - name: Prepare Project Structure
        run: |
          mkdir -p dist
          if [ -f "index.html" ]; then
            cp index.html dist/
          fi

          cat << 'EOF' > package.json
          {
            "name": "mini-militia-clone",
            "version": "1.0.0",
            "scripts": {
              "build": "echo 'Web ready'"
            }
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. إعداد Capacitor وتفعيل الأندرويد
      - name: Setup Capacitor for Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --force
          if [ ! -d "android" ]; then
            npx cap init "Mini Militia" "com.gamesta.minimilitia" --web-dir "dist"
            npx cap add android
          fi
          npx cap sync android

      # 3. إجبار الشاشة على الفتح بالعرض فقط (Force Landscape Orientation)
      - name: Force Landscape Mode in Android Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:name="\.MainActivity"/android:name="\.MainActivity" android:screenOrientation="sensorLandscape"/g' $MANIFEST
          fi

      # 4. حل تعارض مكتبات كوتلن المكررة
      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix Gradle Wrapper Version
        run: |
          cd android
          gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Generate Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MiniMilitia,OU=Game,O=Gamesta,L=City,S=State,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMilitia-Landscape-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
